interface Capture {
  id: string; // uuid
  user_id: string;
  raw_audio_url?: string; // Supabase Storage path
  transcript: string; // Whisper output
  summary?: string; // GPT-4o-mini, 1-2 sentences
  tags: string[]; // auto-suggested + user edited
  project_id?: string | null;
  source: 'back_tap' | 'widget' | 'share' | 'pwa_button' | 'manual';
  location?: {
    lat: number;
    lng: number;
    label?: string; // "Discovery Park, Seattle"
  };
  created_at: string; // ISO
  status: 'inbox' | 'archived' | 'tasked' | 'project';
  embedding?: number[]; // pgvector 1536d
}

// Project — lightweight grouping
interface Project {
  id: string;
  user_id: string;
  name: string; // "Chicago Wedding"
  color: string; // "stone" | "emerald" | "amber" — neutral only
  icon: string; // emoji or lucide name
  created_at: string;
  capture_count?: number;
}

// Tag — derived, not separate table initially
interface Tag {
  name: string; // "garden", "book-idea", "chicago"
  count: number;
  last_used: string;
}`}),i(ar,{lang:"SQL • Supabase Schema",code:`-- Enable pgvector
create extension vector;

create table captures (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users not null,
  raw_audio_url text,
  transcript text not null,
  summary text,
  tags text[] default '{}',
  project_id uuid references projects(id),
  source text check (source in ('back_tap','widget','share','pwa_button','manual')),
  location_lat double precision,
  location_lng double precision,
  location_label text,
  status text default 'inbox' check (status in ('inbox','archived','tasked','project')),
  embedding vector(1536),
  created_at timestamptz default now()
);

create table projects (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users not null,
  name text not null,
  color text default 'stone',
  icon text default '◐',
  created_at timestamptz default now()
);
